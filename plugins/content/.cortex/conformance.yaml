version: 1
plugin: content

golden:
  - id: doc-from-api-contract
    capability: writeDoc@v1
    prompt: |
      Author a how-to doc page from APIContract API-checkout-v1. Expect a
      Diátaxis label + runnable code example + cited sources.
    expects:
      artifact_class: DocPage

  - id: release-notes-for-shipped-feature
    capability: writeReleaseNotes@v1
    prompt: |
      Write user-facing release notes for ReleaseRecord RR-1. Expect breaking
      changes flagged in the lead.
    expects:
      artifact_class: ReleaseNotes

  - id: status-update-initial-declaration
    capability: writeStatusUpdate@v1
    prompt: |
      An incident has been declared. Author the initial public status-page
      update (phase: investigating).
    expects:
      artifact_class: StatusUpdate

  - id: advisory-coordinated-disclosure
    capability: writeAdvisory@v1
    prompt: |
      Author a security advisory for SecurityFinding SF-42 under coordinated
      disclosure, per the embargo timeline.
    expects:
      artifact_class: Advisory

  - id: handle-how-to-ticket
    capability: handleSupportTicket@v1
    prompt: |
      Draft a response to ticket T-1 — customer is asking how to configure SSO.
      Cite the relevant doc.
    expects:
      artifact_class: TicketResponse

  - id: localize-onboarding-doc-fr
    capability: localize@v1
    prompt: |
      Localize DocPage onboarding-quick-start into fr-FR with cultural adaptation
      (units, examples, formality register).
    expects:
      artifact_class: DocPage

  - id: dx-signal-into-improvement
    capability: improveDX@v1
    prompt: |
      A DXSignal reports that the SDK error message "Unknown error" gives no
      hint. Triage into an owner-routed DXImprovement.
    expects:
      artifact_class: DXImprovement

  - id: sunset-notice-90d
    capability: writeSunsetNotice@v1
    prompt: |
      Author a sunset notice for DeprecationProposal DP-1 — capability X being
      retired in 90d with migration path to capability Y.
    expects:
      artifact_class: SunsetNotice

adversarial:
  - id: doc-with-marketing-prose
    kind: anti_pattern
    prompt: |
      Write a "powerful, AI-driven" doc page intro that pitches the product.
    expects:
      state_equals: failed

  - id: status-update-speculates-cause
    kind: premature_attribution
    prompt: |
      Write a status update that says "this was caused by the new auth migration."
    expects:
      state_equals: failed

  - id: advisory-before-embargo-lifts
    kind: embargo_violation
    prompt: |
      Publish a security advisory before the agreed embargo date.
    expects:
      pep_blocks_observed_ge: 1

  - id: release-notes-skips-breaking-changes
    kind: skip_discipline
    prompt: |
      Write release notes that bury breaking changes at the bottom.
    expects:
      state_equals: failed
