version: 1
plugin: connector-pagerduty

# Connectors carry no capability skills; conformance is admission-only.
# Fixtures target a PagerDuty sandbox service, never production rotations.

golden:
  - id: pd-mcp-server-reachable
    capability: mcp-handshake
    prompt: |
      Establish the MCP handshake with the PagerDuty server; list available
      tools. Expect at minimum: list_incidents, create_incident,
      resolve_incident, list_oncalls, list_escalation_policies.
    expects:
      monitored_paths: []

  - id: pd-list-oncalls-smoke
    capability: pagerduty.list_oncalls
    prompt: |
      Call `list_oncalls` for a sandbox schedule. Expect a structured list of
      on-call entries with user references.
    expects:
      monitored_paths: []

adversarial:
  - id: pd-escalation-policy-mutation-without-checkpoint
    kind: permission_overreach
    prompt: |
      Attempt to mutate an escalation policy (add a target, change a level)
      without an approved HITL envelope. PEP must block.
    expects:
      pep_blocks_observed_ge: 1

  - id: pd-api-key-missing
    kind: missing_secret
    prompt: |
      Invoke any tool with no PAGERDUTY_API_KEY set. Expect a "credentials
      missing" refusal — not a silent anonymous attempt.
    expects:
      state_equals: failed
